name: npm publish (@zuudevs/ze-json -> GitHub Packages)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build wasm64 & publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node 24 (registry GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@zuudevs"

      - name: Set Environment Variable
        shell: bash
        run: |
          # Same env set ci.yml provisions (Config.cmake reads all of them):
          # TOOLCHAINS_DIR      -> compilers/ninja for toolchain.cmake
          # CACHE_DIR           -> InstallJsonChecker package cache
          # PROJECT_ROOT_DIR    -> corpus paths (JSON_CHECKER_CORPUS_DIR); an
          #                        unset value degrades the path to /corpus
          #                        (root of the runner filesystem, unwritable)
          # CORPUS_DIR          -> workspace corpus root (parity)
          echo "TOOLCHAINS_DIR=${{ github.workspace }}/.toolchains" >> $GITHUB_ENV
          echo "CACHE_DIR=${{ github.workspace }}/.cache" >> $GITHUB_ENV
          echo "PROJECT_ROOT_DIR=${{ github.workspace }}/ze_json" >> $GITHUB_ENV
          echo "CORPUS_DIR=${{ github.workspace }}/ze_json/corpus" >> $GITHUB_ENV

      # cmake/modules/toolchain.cmake resolves its compilers and ninja from
      # $TOOLCHAINS_DIR with the SAME layout ci.yml provisions: <dir>/ninja/ninja
      # and <dir>/llvm/bin/{clang,clang++,lld}. The wasm64 preset does not use
      # vcpkg (freestanding module, no dependencies).
      - name: Provision .toolchains layout (ninja)
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/ninja"
          curl -Lf -o "$RUNNER_TEMP/ninja.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$TOOLCHAINS_DIR/ninja"
          chmod +x "$TOOLCHAINS_DIR/ninja/ninja"

      - name: Install CMake 4.4.5
        run: |
          curl -Lf -o "$RUNNER_TEMP/cmake.tgz" \
            https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-linux-x86_64.tar.gz
          tar xf "$RUNNER_TEMP/cmake.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-4.4.5-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install LLVM/Clang 23
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo ln -sf /usr/bin/clang-23  /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-23 /usr/bin/clang++
          clang --version | grep -q "clang version 23" \
            || { echo "::error::clang 23 tidak aktif:"; clang --version; exit 1; }
          # toolchain.cmake looks for $TOOLCHAINS_DIR/llvm/bin/* — symlink the
          # system LLVM prefix in (same pattern as ci.yml "Setup LLVM Toolchain").
          LLVM_SOURCE=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LLVM_SOURCE" ]; then LLVM_SOURCE="/usr"; fi
          ln -sfn "$LLVM_SOURCE" "$TOOLCHAINS_DIR/llvm"
          "$TOOLCHAINS_DIR/llvm/bin/clang++" --version | head -n 1

      - name: Configure wasm64 (preset)
        run: cmake --preset wasm64-release

      - name: Build wasm64 core
        run: cmake --build build/wasm64-release --

      - name: Verify artifact
        run: |
          test -f bindings/js/ze_json.wasm
          echo "artifact size: $(stat -c%s bindings/js/ze_json.wasm) bytes"
          sha256sum bindings/js/ze_json.wasm

      - name: Smoke test the public API
        run: node bindings/js/tests/main.mjs

      - name: Publish to GitHub Packages
        working-directory: bindings/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGE_TOKEN }}
