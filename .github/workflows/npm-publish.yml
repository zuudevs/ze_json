name: npm publish (@zuudevs/ze-json)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build wasm64 & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node 24 dulu — smoke test di bawah meng-instantiate wasm memory64
      # (node bawaan runner lebih tua dan menolak tabel 64-bit).
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # NOTE: there is no 3.40.x release - CMake jumped 3.31 -> 4.0, so
      # install 4.4.4 (satisfies the project's 3.40 minimum) from the
      # official Kitware binary.
      - name: Install CMake 4.4.4
        run: |
          curl -Lf -o "$RUNNER_TEMP/cmake.tgz" \
            https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-linux-x86_64.tar.gz
          tar xf "$RUNNER_TEMP/cmake.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-4.4.4-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The wasm64 build uses Ninja (project generator preset) - ubuntu has it
      # in apt.
      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          ninja --version

      # The wasm64 presets point straight to clang/clang++ on PATH. Install
      # LLVM 23 (same major as dev machine) and force it as the unversioned
      # `clang`/`clang++` - update-alternatives alone did NOT override the
      # runner's stock clang-18 (priority tie), which then rejected the
      # attribute ordering. Force symlinks + hard verify.
      - name: Install LLVM/Clang 23
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo ln -sf /usr/bin/clang-23  /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-23 /usr/bin/clang++
          clang --version | grep -q "clang version 23" \
            || { echo "::error::clang 23 tidak aktif:"; clang --version; exit 1; }
          clang --version

      - name: Configure wasm64 (preset)
        run: cmake --preset wasm64-release

      - name: Build wasm64
        run: cmake --build build/wasm64-release

      # The `.wasm` path is now real: build/wasm64-release/src/ze_json_core.wasm
      - name: Smoke test the public API
        run: node js/test/main.mjs

      # `npm publish` runs the `prepack` script, which copies the freshly
      # built ze_json_core.wasm next to ze_json.mjs inside the tarball.
      - name: Publish @zuudevs/ze-json
        working-directory: js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
