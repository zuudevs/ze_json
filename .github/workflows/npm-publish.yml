name: npm publish (@zuudevs/ze-json -> GitHub Packages)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build wasm64 & publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node 24 (registry GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@zuudevs"

      - name: Set Environment Variable
        shell: bash
        run: |
          echo "CORPUS_DIR=${{ github.workspace }}/corpus" >> $GITHUB_ENV
          echo "TOOLCHAINS_DIR=${{ github.workspace }}/.toolchains" >> $GITHUB_ENV
          echo "CACHE_DIR=${{ github.workspace }}/.cache" >> $GITHUB_ENV
          echo "PROJECT_ROOT_DIR=${{ github.workspace }}/ze_json" >> $GITHUB_ENV

      - name: Setup Toolchains Directory
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/cmake"
          mkdir -p "$TOOLCHAINS_DIR/ninja"
          mkdir -p "$TOOLCHAINS_DIR/vcpkg"

      - name: Install CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -Lf -o "$RUNNER_TEMP/cmake.zip" \
              https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-windows-x86_64.zip
            unzip -q "$RUNNER_TEMP/cmake.zip" -d "$TOOLCHAINS_DIR/cmake"
            echo "$TOOLCHAINS_DIR/cmake/bin" >> "$GITHUB_PATH"
          else
            curl -Lf -o "$RUNNER_TEMP/cmake.tgz" \
              https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-linux-x86_64.tar.gz
            tar xf "$RUNNER_TEMP/cmake.tgz" -C "$TOOLCHAINS_DIR/cmake"
            echo "$TOOLCHAINS_DIR/cmake/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Ninja
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -Lf -o "$RUNNER_TEMP/ninja.zip" \
              https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip
            unzip -q "$RUNNER_TEMP/ninja.zip" -d "$TOOLCHAINS_DIR/ninja"
            echo "$TOOLCHAINS_DIR/ninja" >> "$GITHUB_PATH"
          else
            curl -Lf -o "$RUNNER_TEMP/ninja.zip" \
              https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
            unzip -q "$RUNNER_TEMP/ninja.zip" -d "$TOOLCHAINS_DIR/ninja"
            chmod +x "$TOOLCHAINS_DIR/ninja/ninja"
            echo "$TOOLCHAINS_DIR/ninja" >> "$GITHUB_PATH"
          fi

      - name: Setup Vcpkg in Toolchains
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$TOOLCHAINS_DIR/vcpkg"
          if [ "$RUNNER_OS" == "Windows" ]; then
            cd "$TOOLCHAINS_DIR/vcpkg" && ./bootstrap-vcpkg.bat
          else
            cd "$TOOLCHAINS_DIR/vcpkg" && ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$TOOLCHAINS_DIR/vcpkg" >> $GITHUB_ENV
        
      - name: Setup LLVM Toolchain
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mkdir -p "$TOOLCHAINS_DIR"
            LLVM_SOURCE="C:/Program Files/LLVM"
            
            rm -rf "$TOOLCHAINS_DIR/llvm"
            
            if [ -d "$LLVM_SOURCE" ]; then
              echo "[+] Symlinking pre-installed LLVM on Windows runner..."
              WIN_TARGET="$(cygpath -w "$TOOLCHAINS_DIR/llvm")"
              WIN_SOURCE="$(cygpath -w "$LLVM_SOURCE")"
              
              MSYS_NO_PATHCONV=1 cmd.exe /c mklink /D "$WIN_TARGET" "$WIN_SOURCE"
            else
              echo "[-] Pre-installed LLVM not found!"
              exit 1
            fi
          else
            echo "[+] Symlinking pre-installed LLVM on Linux runner..."
            LLVM_SOURCE=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$LLVM_SOURCE" ]; then
              LLVM_SOURCE="/usr" 
            fi
            echo "Menggunakan source: $LLVM_SOURCE"
            rm -rf "$TOOLCHAINS_DIR/llvm"
            ln -s "$LLVM_SOURCE" "$TOOLCHAINS_DIR/llvm"
          fi

      - name: Setup MSVC Toolchain
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            VSWHERE="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            
            if [ -f "$VSWHERE" ]; then
              MSVC_SOURCE=$("$VSWHERE" -latest -property installationPath | tr -d '\r' | tr '\\' '/')
            else
              MSVC_SOURCE="C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
            fi

            echo "[*] Detected MSVC Path: $MSVC_SOURCE"
            rm -rf "$TOOLCHAINS_DIR/MSVC"
            
            if [ -n "$MSVC_SOURCE" ] && [ -d "$MSVC_SOURCE" ]; then
              echo "[+] Symlinking pre-installed MSVC Build Tools on Windows runner..."
              WIN_TARGET="$(cygpath -w "$TOOLCHAINS_DIR/MSVC")"
              WIN_SOURCE="$(cygpath -w "$MSVC_SOURCE")"
              MSYS_NO_PATHCONV=1 cmd.exe /c mklink /D "$WIN_TARGET" "$WIN_SOURCE"
            else
              echo "[-] MSVC pre-installed path not found!"
              exit 1
            fi
          fi
      - name: Install Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'ze_json/scripts/requirements.txt'

      - name: Install Python
        shell: bash
        run: |
           python -m pip install --upgrade pip
           pip install -r ze_json/scripts/requirements.txt

      - name: Configure wasm64 (preset)
        run: cmake --preset wasm64-release

      - name: Build wasm64 core
        run: cmake --build build/wasm64-release --

      - name: Verify artifact
        run: |
          test -f bindings/js/ze_json.wasm
          echo "artifact size: $(stat -c%s bindings/js/ze_json.wasm) bytes"
          sha256sum bindings/js/ze_json.wasm

      - name: Smoke test the public API
        run: node bindings/js/tests/main.mjs

      - name: Publish to GitHub Packages
        working-directory: bindings/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
