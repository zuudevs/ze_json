name: C++ CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [native-debug, native-release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: ze_json
      
      - name: Set Environment Variable
        shell: bash
        run: |
          echo "CORPUS_DIR=${{ github.workspace }}/ze_json/data/CORPUS" >> $GITHUB_ENV
          echo "TOOLCHAINS_DIR=${{ github.workspace }}/.toolchains" >> $GITHUB_ENV

      - name: Setup Toolchains Directory
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/cmake"
          mkdir -p "$TOOLCHAINS_DIR/ninja"
          mkdir -p "$TOOLCHAINS_DIR/vcpkg"

      - name: Install CMake 4.4.5
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -Lf -o "$RUNNER_TEMP/cmake.zip" \
              https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-windows-x86_64.zip
            unzip -q "$RUNNER_TEMP/cmake.zip" -d "$TOOLCHAINS_DIR/cmake"
            echo "$TOOLCHAINS_DIR/cmake/cmake-4.4.5-windows-x86_64/bin" >> "$GITHUB_PATH"
          else
            curl -Lf -o "$RUNNER_TEMP/cmake.tgz" \
              https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-linux-x86_64.tar.gz
            tar xf "$RUNNER_TEMP/cmake.tgz" -C "$TOOLCHAINS_DIR/cmake"
            echo "$TOOLCHAINS_DIR/cmake/cmake-4.4.5-linux-x86_64/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Ninja
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -Lf -o "$RUNNER_TEMP/ninja.zip" \
              https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip
            unzip -q "$RUNNER_TEMP/ninja.zip" -d "$TOOLCHAINS_DIR/ninja"
            echo "$TOOLCHAINS_DIR/ninja" >> "$GITHUB_PATH"
          else
            curl -Lf -o "$RUNNER_TEMP/ninja.zip" \
              https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
            unzip -q "$RUNNER_TEMP/ninja.zip" -d "$TOOLCHAINS_DIR/ninja"
            chmod +x "$TOOLCHAINS_DIR/ninja/ninja"
            echo "$TOOLCHAINS_DIR/ninja" >> "$GITHUB_PATH"
          fi

      - name: Setup Vcpkg in Toolchains
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/vcpkg-2026.10.16"
          git clone https://github.com/microsoft/vcpkg.git "$TOOLCHAINS_DIR/vcpkg-2026.10.16"
          if [ "$RUNNER_OS" == "Windows" ]; then
            cd "$TOOLCHAINS_DIR/vcpkg-2026.10.16" && ./bootstrap-vcpkg.bat
          else
            cd "$TOOLCHAINS_DIR/vcpkg-2026.10.16" && ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$TOOLCHAINS_DIR/vcpkg-2026.10.16" >> $GITHUB_ENV
        
      - name: Setup LLVM Toolchain
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/llvm"
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl.exe -Lf -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/clang+llvm-23.1.5-x86_64-pc-windows-msvc.tar.xz
            tar -xf llvm.tar.xz -C "$TOOLCHAINS_DIR/llvm" --strip-components=1
            rm llvm.tar.xz
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang llvm
          fi

      - name: Setup MSVC Toolchain
        shell: bash
        run: |
          mkdir -p "$TOOLCHAINS_DIR/MSVC"
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl.exe -Lf -o "$RUNNER_TEMP/vs_buildtools.exe" https://aka.ms/vs/17/release/vs_buildtools.exe
            "$RUNNER_TEMP/vs_buildtools.exe" \
              --quiet --wait --norestart --nocache \
              --installPath "$TOOLCHAINS_DIR/MSVC" \
              --add Microsoft.VisualStudio.Workload.VCTools \
              --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              --add Microsoft.VisualStudio.Component.Windows11SDK.22621 || true
          fi

      - name: Install Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'ze_json/scripts/install_json_checker/requirements.txt'

      - name: Install JSON checker
        shell: bash
        env:
            TEMP: '$RUNNER_TEMP'
            ZE_JSON: '${{ github.workspace }}/ze_json'
        run: | 
          python -m pip install --upgrade pip
          python -m pip install -r ze_json/scripts/install_json_checker/requirements.txt
          python ze_json/scripts/install_json_checker/main.py
          
      - name: Configure CMake (preset ${{ matrix.preset }})
        shell: bash
        working-directory: ze_json
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: ze_json
        run: cmake --build build/${{ matrix.preset }}

      - name: Version Check
        working-directory: ze_json
        run: python scripts/ValidateValidateVersion.py || python scripts/ValidateVersion.py

      - name: Run Tests (ctest)
        working-directory: ze_json
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure